[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "screen2social"
version = "0.1.0"
description = "Local-first automation from screen recordings to social-ready video packages."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Juan Manuel Torres" }]
dependencies = ["simpleobsws==1.4.3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
screen2social = "screen2social.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
